<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>模型审阅工作台</title><style>
*{box-sizing:border-box}body{margin:0;background:#101719;color:#edf2ef;font:15px "Microsoft YaHei",sans-serif;height:100vh;display:grid;grid-template-columns:310px 1fr}
aside{padding:26px 22px;background:#182224;border-right:1px solid #344446;overflow:auto}h1{font-size:23px;margin:0 0 7px}small{color:#9eb0b1;line-height:1.7}label{display:block;margin-top:22px;margin-bottom:8px;color:#bbd6cf}select{background:#243336;border:1px solid #516964;color:white;border-radius:6px;width:100%;padding:12px;font:inherit}button,a.link{display:inline-block;background:#293d3c;color:#cce8dc;border:1px solid #4e7067;border-radius:6px;padding:9px 12px;text-decoration:none;cursor:pointer;margin:6px 3px 0 0}p{line-height:1.7}#source{word-break:break-all;font:11px monospace;color:#94aaa7}main{position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 50%,#3b4d50,#111c20 85%)}canvas{width:100%;height:100%;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}#badge{position:absolute;left:28px;top:24px;background:#102c28cc;border:1px solid #64877c;padding:11px 16px;border-radius:25px;color:#bfe6d5}#hint{position:absolute;bottom:22px;left:28px;color:#bccdca;font-size:13px;pointer-events:none}.error{color:#ffaaaa}#stats{font-size:13px;color:#b5c9c2}hr{border:0;border-top:1px solid #344746;margin:25px 0}@media(max-width:700px){body{grid-template-columns:230px 1fr}aside{padding:18px 12px}h1{font-size:18px}}
</style><aside><h1>模型审阅工作台</h1><small>参考模型与本项目两种建模风格<br>萌趣世界 · 像素硬核<br>拖动旋转 · 滚轮缩放 · 完全离线</small>
<label for="model">选择模型</label><select id="model"></select><p id="stats"></p><button id="reset">重置视角</button><button id="spin">自动旋转</button>
<hr><p id="type"></p><p id="source"></p><a id="obj" class="link" href="#">OBJ 模型</a><a id="texture" class="link" href="#">原纹理</a>
<hr><small>原模型按源码的关节、旋转与纹理 UV 转换，保留中立姿态。载具包含该源码中的 Dacia 与 UAZ，以及全部贴图配色。普通与大型空投均可查看落地和带伞形态。<br><br>审阅不代表已将飞机、伞、载具、空投或盒子移植进游戏；药品、背包、投掷物是独立制作的立体物品模型。</small></aside>
<main><canvas id="view"></canvas><div id="badge"></div><div id="hint">左键拖动旋转 · 滚轮缩放 · 无外部脚本或网络请求</div></main>
<script>
"use strict";const models=__MODELS_JSON__;
const canvas=document.getElementById("view"),gl=canvas.getContext("webgl",{antialias:true,alpha:false,preserveDrawingBuffer:true});
if(!gl){document.getElementById("badge").textContent="浏览器无法使用 WebGL";throw Error("WebGL unavailable");}
function shader(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s;}
const vs=shader(gl.VERTEX_SHADER,`attribute vec3 pos;attribute vec2 uv;attribute vec3 normal;uniform vec3 center;uniform float scale;uniform float yaw;uniform float pitch;uniform float aspect;varying vec2 vuv;varying float light;void main(){vec3 p=(pos-center)*scale;float c=cos(yaw),s=sin(yaw);p=vec3(c*p.x+s*p.z,p.y,-s*p.x+c*p.z);c=cos(pitch);s=sin(pitch);p=vec3(p.x,c*p.y-s*p.z,s*p.y+c*p.z);gl_Position=vec4(p.x/aspect,p.y,-p.z*.25,1.);vuv=uv;light=.62+.55*max(0.,dot(normal,normalize(vec3(-.4,.8,.55))))+.2*max(0.,dot(normal,normalize(vec3(.8,.3,-.7))));}`);
const fs=shader(gl.FRAGMENT_SHADER,`precision mediump float;uniform sampler2D tex;varying vec2 vuv;varying float light;void main(){vec4 c=texture2D(tex,vuv);if(c.a<.05)discard;gl_FragColor=vec4(c.rgb*light,c.a);}`);
const program=gl.createProgram();gl.attachShader(program,vs);gl.attachShader(program,fs);gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program);
const buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);
for(const [name,size,offset] of [["pos",3,0],["uv",2,12],["normal",3,20]]){const i=gl.getAttribLocation(program,name);gl.enableVertexAttribArray(i);gl.vertexAttribPointer(i,size,gl.FLOAT,false,32,offset);}
const texture=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,texture);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
gl.enable(gl.DEPTH_TEST);gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);gl.clearColor(.095,.14,.16,1);
const uniforms=Object.fromEntries(["center","scale","yaw","pitch","aspect"].map(n=>[n,gl.getUniformLocation(program,n)]));
let current,yaw=.7,pitch=-.27,zoom=1,drag=null,spin=false,ready=false;const select=document.getElementById("model");
for(let i=0;i<models.length;i++){const option=document.createElement("option");option.value=i;option.textContent=models[i].name;select.append(option);}
function load(index){current=models[index];ready=false;gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(current.vertices),gl.STATIC_DRAW);const image=new Image();image.onload=()=>{gl.bindTexture(gl.TEXTURE_2D,texture);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,image);ready=true;render();};image.src=current.texture;document.getElementById("badge").textContent=current.name;document.getElementById("stats").textContent=current.constructor_cuboids?`${current.constructor_cuboids} 个原始立方体 · ${current.triangles} 个三角面`:`曲面网格 · ${current.triangles} 个三角面`;document.getElementById("type").textContent=current.kind;document.getElementById("source").textContent=current.source;document.getElementById("obj").href=`obj/${current.id}.obj`;document.getElementById("texture").href=`obj/${current.id}.png`;zoom=1;window.reviewState={id:current.id,triangles:current.triangles};}
function render(){const dpr=Math.min(devicePixelRatio,2),w=Math.round(canvas.clientWidth*dpr),h=Math.round(canvas.clientHeight*dpr);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}gl.viewport(0,0,w,h);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);if(!ready)return;const [low,high]=current.bounds,center=low.map((v,i)=>(v+high[i])/2),extent=Math.max(...low.map((v,i)=>high[i]-v));gl.uniform3fv(uniforms.center,center);gl.uniform1f(uniforms.scale,1.42*zoom/extent*Math.min(1,w/h));gl.uniform1f(uniforms.yaw,yaw);gl.uniform1f(uniforms.pitch,pitch);gl.uniform1f(uniforms.aspect,w/h);gl.drawArrays(gl.TRIANGLES,0,current.vertices.length/8);window.reviewState.rendered=true;}
select.onchange=()=>load(+select.value);document.getElementById("reset").onclick=()=>{yaw=.7;pitch=-.27;zoom=1;render();};document.getElementById("spin").onclick=()=>{spin=!spin;document.getElementById("spin").textContent=spin?"停止旋转":"自动旋转";};
canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId);};canvas.onpointermove=e=>{if(drag){yaw+=(e.clientX-drag[0])*.009;pitch=Math.max(-1.5,Math.min(1.5,pitch+(e.clientY-drag[1])*.009));drag=[e.clientX,e.clientY];render();}};canvas.onpointerup=()=>drag=null;canvas.onwheel=e=>{e.preventDefault();zoom=Math.max(.3,Math.min(4,zoom*Math.exp(-e.deltaY*.001)));render();};window.onresize=render;
function animate(){if(spin){yaw+=.004;render();}requestAnimationFrame(animate);}load(0);animate();
</script></html>
