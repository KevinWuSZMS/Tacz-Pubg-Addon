        if (checkName in ['combatRulesChecks', 'combatWireChecks', 'pubgSettingsChecks', 'pubgMedicineChecks', 'armorHudLayoutChecks']) {
            classpath += files('../downloads/tacz/tacz-neoforge-1.21.1-1.1.8-hotfix-r7.jar')
        }
        if (checkName == 'heavyWeaponExplosionChecks') {
            classpath += files('../downloads/tacz/runtime-libraries/commons-math3-3.6.1.jar',
                    '../downloads/tacz/runtime-libraries/luaj-core-3.0.8-figura.jar')
        }
        javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    }
    tasks.named('check').configure { dependsOn logicalCheck }
}

def lootRespawnSnapshotChecks = tasks.register('lootRespawnSnapshotChecks', JavaExec) {
    group = 'verification'
    description = 'Checks region coefficient refresh snapshots in memory without starting Minecraft.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.example.examplemod.lootspawn.LootRespawnSnapshotChecks'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
}
tasks.named('check').configure { dependsOn lootRespawnSnapshotChecks }

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// Freeze the successful official client launch into a unique directory outside build/.
// The helper runs while Gradle still owns this project's build lock, before another compile
// can replace or remove the classes that a running development client will load lazily.
tasks.register('prepareClientSnapshot', Exec) {
    group = 'mod development'
    description = 'Builds and freezes a complete client runtime without starting Minecraft.'
    dependsOn tasks.named('createClientLaunchScript')
    def snapshotPointer = providers.gradleProperty('clientSnapshotPointer').orElse(
            file('../.runtime/latest-client-snapshot.json').absolutePath)
    workingDir projectDir
    commandLine 'powershell.exe', '-NoProfile', '-ExecutionPolicy', 'Bypass',
            '-File', file('../scripts/create-client-snapshot.ps1').absolutePath,
            '-ProjectRoot', projectDir.absolutePath, '-PointerFile', snapshotPointer.get()
}
