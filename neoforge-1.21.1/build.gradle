    def logicalCheck = tasks.register(checkName, JavaExec) {
        group = 'verification'
        description = 'Checks loot catalog, static mesh or first-person finite values without starting Minecraft.'
        dependsOn tasks.named('testClasses')
        classpath = sourceSets.test.runtimeClasspath
        mainClass = checkClass
        if (checkName in ['heavyWeaponChecks', 'heavyWeaponExplosionChecks']) {
            classpath += files('../downloads/tacz/tacz-neoforge-1.21.1-1.1.8-hotfix-r7.jar')
