name: Mod JAR
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: neoforge-1.21.1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: ./gradlew --console=plain jar
        working-directory: neoforge-1.21.1
      - uses: actions/upload-artifact@v4
        with:
          name: tacz-pubg-mod
          path: neoforge-1.21.1/build/libs/*.jar
          if-no-files-found: error
